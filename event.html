<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>軌跡</title><link rel="stylesheet" href="css/styles.css" /></head>
<body data-event-public class="harvest-public-page">
  <main class="app-shell event-public-main">
    <section class="event-public-first-view" data-event-public-view>
      <video playsinline preload="metadata" data-event-public-video></video>
      <div class="event-public-overlay" data-event-public-overlay hidden></div>
      <button class="public-video-start" type="button" data-event-public-start>
        <span class="public-video-guide">↓</span><span class="public-video-play-icon">▶</span><strong>動画を見る</strong>
      </button>
    </section>
    <section class="event-public-story">
      <h1 data-event-public-title>動画を準備しています</h1>
      <p class="public-story-meta" data-event-public-note></p>
      <p class="status" data-event-public-status role="status">読み込み中です。</p>
    </section>
  </main>
  <script src="js/event.js"></script>
</body>
</html>
